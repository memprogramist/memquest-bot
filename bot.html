<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>memprogramist — игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0d0d0f;
    --card: #17171c;
    --card-hover: #1f1f26;
    --text: #e8e8ec;
    --muted: #8a8a96;
    --accent: #4ade80;
    --accent-dim: #22c55e;
    --border: #26262e;
    --danger: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen {
    display: none;
    padding: 20px;
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    animation: fade 0.3s ease;
  }
  .screen.active { display: block; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    text-align: center;
    padding: 30px 0 20px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .header h1 span { color: var(--accent); }
  .header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin: 24px 0 12px;
    font-weight: 600;
  }

  .game-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }
  .game-card:active {
    background: var(--card-hover);
    transform: scale(0.98);
  }
  .game-card .emoji {
    font-size: 36px;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border-radius: 12px;
    flex-shrink: 0;
  }
  .game-card .info h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .game-card .info p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }

  .game-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 16px;
  }
  .back-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .back-btn:active { background: var(--card-hover); }
  .game-top h2 {
    font-size: 16px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .scene-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    min-height: 160px;
    display: flex;
    align-items: center;
    animation: fade 0.4s ease;
  }
  .scene-box p {
    font-size: 16px;
    line-height: 1.6;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .choice-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 16px 18px;
    border-radius: 12px;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .choice-btn:active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    transform: scale(0.98);
  }
  .choice-btn::before {
    content: "›";
    color: var(--accent);
    font-weight: 700;
    font-size: 18px;
  }
  .choice-btn:active::before { color: #000; }

  .end-screen {
    text-align: center;
    padding: 60px 20px;
  }
  .end-screen .big-emoji {
    font-size: 72px;
    margin-bottom: 20px;
    display: block;
  }
  .end-screen h2 {
    font-size: 24px;
    margin-bottom: 12px;
  }
  .end-screen p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .end-screen .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 16px 32px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    margin-bottom: 10px;
    transition: background 0.2s;
  }
  .end-screen .btn:active { background: var(--accent-dim); }
  .end-screen .btn.secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .footer {
    text-align: center;
    padding: 30px 0 20px;
    color: var(--muted);
    font-size: 12px;
  }
  .footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<div id="screen-main" class="screen active">
  <div class="header">
    <h1>mem<span>programist</span></h1>
    <p>Мини-игры в Telegram</p>
  </div>

  <div class="section-title">Истории</div>
  <div id="games-list"></div>

  <div class="footer">
    by <a href="https://t.me/memprogramist">memprogramist</a>
  </div>
</div>

<div id="screen-game" class="screen">
  <div class="game-top">
    <button class="back-btn" onclick="goMain()">‹</button>
    <h2 id="game-title">История</h2>
  </div>
  <div class="scene-box">
    <p id="scene-text"></p>
  </div>
  <div class="choices" id="choices"></div>
</div>

<div id="screen-end" class="screen">
  <div class="end-screen">
    <span class="big-emoji" id="end-emoji">🎉</span>
    <h2 id="end-title">Победа!</h2>
    <p id="end-text"></p>
    <button class="btn" onclick="restartGame()">Пройти заново</button>
    <button class="btn secondary" onclick="goMain()">К списку игр</button>
  </div>
</div>

let currentStory = null;

function renderGameList() {
  const list = document.getElementById('games-list');
  list.innerHTML = '';
  Object.keys(STORIES).forEach(id => {
    const story = STORIES[id];
    const card = document.createElement('div');
    card.className = 'game-card';
    card.onclick = () => startGame(id);
    card.innerHTML = `
      <div class="emoji">${story.emoji}</div>
      <div class="info">
        <h3>${story.title}</h3>
        <p>${story.description}</p>
      </div>
    `;
    list.appendChild(card);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startGame(storyId) {
  currentStory = STORIES[storyId];
  document.getElementById('game-title').textContent = currentStory.title;
  goScene(currentStory.start);
  showScreen('screen-game');
}

function goScene(sceneId) {
  const scene = currentStory.scenes[sceneId];
  if (!scene) return;

  if (scene.end) {
    document.getElementById('end-emoji').textContent = scene.endEmoji || "🎬";
    document.getElementById('end-title').textContent = scene.endTitle || "Конец";
    document.getElementById('end-text').textContent = scene.endText || "";
    showScreen('screen-end');
    return;
  }

  document.getElementById('scene-text').textContent = scene.text;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  scene.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.onclick = () => goScene(choice.next);
    choicesEl.appendChild(btn);
  });

  showScreen('screen-game');
}

function restartGame() {
  if (currentStory) goScene(currentStory.start);
}

function goMain() {
  showScreen('screen-main');
}

renderGameList();

  window.Telegram.WebApp.expand();
